# yaml-language-server: $schema=https://raw.githubusercontent.com/karoterra/aviutl2-aulua/refs/heads/main/schema/aulua.schema.json
project:
  variables:
    NAME: Lens_S
    AUTHOR: σ軸
    PUBLISH_PAGE: https://github.com/sigma-axis/aviutl2_script_Lens_S
    LEAST_AVIUTL_VERSION: "2011000"
    LEAST_AVIUTL_VERSION_STRING: "2.1.10"
    LEAST_BASIC_S_VERSION: "2.88"

package:
  id: Lens_S
  name: レンズ・アクリル効果スクリプト Lens_S
  version: v1.10
  information: "{name} {version} by {AUTHOR}"
  script_sub_dir: ""
  uninstall_sub_folder_file: false
  message:
    text: |
      # Lens_S AviUtl ExEdit2 レンズ・アクリル効果スクリプト

      オブジェクトの背景をレンズのように歪めて透過させたり，一部分を磨りガラスのように背景をぼかして映したりできるスクリプトです．

      公開ページ:
      https://github.com/sigma-axis/aviutl2_script_Lens_S

      紹介動画:
      https://www.nicovideo.jp/watch/sm46811531

      お願い:
      ニコニコ動画での親作品登録をしていただけると励みになります．
      作品 ID: sm46811531

  assets:
    - src: README.md
      dest: Script/{id}/README.md
    - src: LICENSE
      dest: Script/{id}/LICENSE
  file_name: package.au2pkg.zip

build:
  out_dir: build

scripts:
  - name: "Lens_S.lua"
    sources:
      - path: script/preamble.lua
      - path: script/Lens_S.lua

  - name: "@Lens_S.anm2"
    sources:
      - path: script/preamble.lua
      - label: アクリルσ
        path: script/アクリルσ/main.lua
      - label: レンズσ
        path: script/レンズσ/main.lua

language:
  files:
    - path: build/Default.Lens_S.aul2
      text: false
      tooltip: true
